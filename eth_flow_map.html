<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethiopia displacement flow map, 2020–2024 — IOM DTM</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root{
    --surface-1:#fcfcfb; --page:#f9f9f7; --panel:rgba(252,252,251,.94);
    --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
    --border:rgba(11,11,11,0.12);
    --flow:#256abf; --flow-strong:#0d366b; --node:#eb6834; --casing:#fcfcfb;
    --tiles:"light";
  }
  @media (prefers-color-scheme: dark){
    :root{
      --surface-1:#1a1a19; --page:#0d0d0d; --panel:rgba(26,26,25,.92);
      --text-primary:#fff; --text-secondary:#c3c2b7; --muted:#898781;
      --border:rgba(255,255,255,0.14);
      --flow:#6da7ec; --flow-strong:#cde2fb; --node:#d95926; --casing:#1a1a19;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;}
  body{background:var(--page);color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  #map{position:absolute;inset:0;background:var(--page);}
  .leaflet-container{background:var(--page);}
  /* control panel */
  .panel{position:absolute;top:14px;left:14px;z-index:1000;width:290px;
    background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--border);
    border-radius:12px;padding:14px 15px;box-shadow:0 6px 22px rgba(0,0,0,.16);}
  .panel h1{font-size:15px;margin:0 0 3px;letter-spacing:-0.01em;}
  .panel p.sub{font-size:12px;color:var(--text-secondary);margin:0 0 10px;line-height:1.45;}
  .lab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 5px;}
  .years{display:flex;gap:5px;flex-wrap:wrap;}
  .years button{flex:1;min-width:44px;border:1px solid var(--border);background:transparent;
    color:var(--text-secondary);font:inherit;font-size:13px;font-variant-numeric:tabular-nums;
    padding:6px 0;border-radius:8px;cursor:pointer;}
  .years button[aria-pressed="true"]{background:var(--flow);color:#fff;border-color:transparent;}
  .stat{font-size:12.5px;color:var(--text-secondary);margin:10px 0 0;line-height:1.5;}
  .stat b{color:var(--text-primary);font-variant-numeric:tabular-nums;}
  .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);}
  input[type=range]{width:100%;accent-color:var(--flow);}
  .toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-secondary);margin-top:8px;cursor:pointer;}
  .legend{position:absolute;bottom:16px;left:14px;z-index:1000;background:var(--panel);
    backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--text-secondary);max-width:250px;}
  .legend .lrow{display:flex;align-items:center;gap:9px;margin:5px 0;}
  .legend svg{overflow:visible;display:block;}
  .legend b{color:var(--text-primary);}
  .credit{position:absolute;bottom:4px;right:6px;z-index:1000;font-size:10.5px;color:var(--muted);
    background:var(--panel);padding:2px 6px;border-radius:5px;}
  /* flow + node styling */
  .casing{fill:none;stroke:var(--casing);stroke-opacity:.9;stroke-linecap:round;}
  .flow{fill:none;stroke:var(--flow);stroke-opacity:.85;stroke-linecap:round;cursor:pointer;
    transition:stroke-opacity .1s;}
  .flow:hover{stroke:var(--flow-strong);stroke-opacity:1;}
  .arrow{fill:var(--flow);stroke:var(--casing);stroke-width:.8;pointer-events:none;}
  .node{fill:var(--node);fill-opacity:.55;stroke:var(--node);stroke-width:1.5;cursor:pointer;}
  .node:hover{fill-opacity:.8;}
  .nodelab{fill:var(--text-primary);font-size:11px;font-weight:600;paint-order:stroke;
    stroke:var(--casing);stroke-width:3px;stroke-linejoin:round;pointer-events:none;}
  .tip{position:fixed;pointer-events:none;z-index:2000;background:var(--text-primary);
    color:var(--surface-1);font-size:12px;padding:7px 9px;border-radius:7px;
    box-shadow:0 4px 14px rgba(0,0,0,.28);opacity:0;transition:opacity .08s;max-width:230px;}
  .tip b{font-size:13px;}
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>Ethiopia — displacement flows</h1>
  <p class="sub">Arrows run from <b>region of origin</b> to the <b>region now hosting</b> displaced people. Width = number of IDPs. Circles = IDPs currently hosted in each region.</p>
  <div class="lab">Year (year-end snapshot)</div>
  <div class="years" id="years"></div>
  <div class="stat" id="stat"></div>
  <div class="lab">Minimum flow to show</div>
  <div class="row"><input type="range" id="minflow" min="0" max="100000" step="1000" value="0">
    <span id="minflowval" style="min-width:56px;text-align:right;font-variant-numeric:tabular-nums;">0</span></div>
  <label class="toggle"><input type="checkbox" id="crossOnly"> Cross-region flows only (hide within-region)</label>
</div>

<div class="legend" id="legend"></div>
<div class="credit">Tiles © CARTO / © OpenStreetMap contributors</div>
<div class="tip" id="tip"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="data/eth_data.js"></script>
<script>
(function(){
  const D = window.DTM_DATA;
  const cssv = n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;

  const map = L.map('map',{zoomControl:true,minZoom:5,maxZoom:9});
  const tileUrl = dark
    ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
  L.tileLayer(tileUrl,{maxZoom:9,attribution:''}).addTo(map);

  // SVG overlay in Leaflet's overlay pane
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.style.position='absolute';
  const g=document.createElementNS(NS,'g');
  svg.appendChild(g);
  map.getPanes().overlayPane.appendChild(svg);

  const tip=document.getElementById('tip');
  const showTip=(html,x,y)=>{tip.innerHTML=html;tip.style.opacity=1;
    tip.style.left=Math.min(x+14,innerWidth-240)+'px';tip.style.top=(y+14)+'px';};
  const hideTip=()=>tip.style.opacity=0;
  const fmt=v=>v.toLocaleString('en-US');

  // ---- build per-year node & flow tables --------------------------
  const centroids=D.centroids;
  const perYear={};
  D.meta.years.forEach(y=>{
    const rows=D.matrices[String(y)]||[];
    const hosted={}, origin={};
    rows.forEach(r=>{
      hosted[r.d]=(hosted[r.d]||0)+r.v;
      origin[r.o]=(origin[r.o]||0)+r.v;
    });
    perYear[y]={rows,hosted,origin};
  });
  // global maxima for stable scales across years
  let maxFlow=0, maxNode=0;
  D.meta.years.forEach(y=>{
    perYear[y].rows.forEach(r=>{ if(r.o!==r.d && r.v>maxFlow) maxFlow=r.v; });
    Object.values(perYear[y].hosted).forEach(v=>{ if(v>maxNode) maxNode=v; });
  });
  const flowW = v => 1.5 + 13*Math.sqrt(v/maxFlow);          // px stroke
  const nodeR = v => 5 + 26*Math.sqrt(v/maxNode);            // px radius

  let YEAR=D.meta.years[D.meta.years.length-1], MINFLOW=0, CROSS=false;

  // ---- year buttons ----------------------------------------------
  const yb=document.getElementById('years');
  D.meta.years.forEach(y=>{
    const b=document.createElement('button');b.textContent=y;
    b.setAttribute('aria-pressed', y===YEAR);
    b.onclick=()=>{YEAR=y;[...yb.children].forEach(c=>c.setAttribute('aria-pressed', +c.textContent===y));render();};
    yb.appendChild(b);
  });
  document.getElementById('minflow').addEventListener('input',e=>{
    MINFLOW=+e.target.value;document.getElementById('minflowval').textContent=fmt(MINFLOW);render();});
  document.getElementById('crossOnly').addEventListener('change',e=>{CROSS=e.target.checked;render();});

  // ---- geometry helpers ------------------------------------------
  function project(name){
    const c=centroids[name]; if(!c) return null;
    return map.latLngToLayerPoint([c.lat,c.lon]);
  }
  // quadratic bezier control point offset perpendicular (right of travel) so
  // A->B and B->A separate; shorten ends to node edges; return path + arrow tip.
  function flowPath(pO,pD,rO,rD){
    const dx=pD.x-pO.x, dy=pD.y-pO.y, len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len;                       // unit along
    const nx=-uy, ny=ux;                              // unit perpendicular (right)
    const s=Math.min(0.22*len,60);                    // arc height
    const mx=(pO.x+pD.x)/2 + nx*s, my=(pO.y+pD.y)/2 + ny*s;
    // trim to node edges along the straight approximation
    const a={x:pO.x+ux*rO, y:pO.y+uy*rO};
    const b={x:pD.x-ux*(rD+2), y:pD.y-uy*(rD+2)};
    // tangent at end for arrowhead: from control point to b
    const tx=b.x-mx, ty=b.y-my, tl=Math.hypot(tx,ty)||1;
    return {d:`M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}`, tip:b, tux:tx/tl, tuy:ty/tl};
  }
  function arrowHead(tip,ux,uy,w){
    const size=Math.max(6,Math.min(w*1.6,16));
    const bx=tip.x-ux*size, by=tip.y-uy*size;
    const px=-uy, py=ux, hw=size*0.6;
    return `${tip.x},${tip.y} ${bx+px*hw},${by+py*hw} ${bx-px*hw},${by-py*hw}`;
  }

  // ---- render -----------------------------------------------------
  let currentFlows=[];
  function render(){
    const {rows,hosted,origin}=perYear[YEAR];
    // stat panel
    const meta=D.yearMeta.find(z=>z.year===YEAR);
    document.getElementById('stat').innerHTML=
      `<b>${fmt(meta.totalIdp)}</b> IDPs · <b>${meta.sites}</b> sites · snapshot ${meta.snapshotDate}`;
    // slider ceiling
    const mf=document.getElementById('minflow'); mf.max=Math.ceil(maxFlow/1000)*1000;
    currentFlows = rows.filter(r=>{
      if(CROSS && r.o===r.d) return false;
      if(r.o===r.d) return false; // self shown as node, never an arrow
      if(r.v<MINFLOW) return false;
      return centroids[r.o] && centroids[r.d];
    }).sort((a,b)=>a.v-b.v); // thin on top
    positionAndDraw();
    buildLegend();
  }

  function positionAndDraw(){
    // size/position the svg to cover current view with padding
    const pad=200;
    const bounds=map.getBounds();
    const tl=map.latLngToLayerPoint(bounds.getNorthWest());
    const br=map.latLngToLayerPoint(bounds.getSouthEast());
    const min=L.point(Math.min(tl.x,br.x)-pad,Math.min(tl.y,br.y)-pad);
    const max=L.point(Math.max(tl.x,br.x)+pad,Math.max(tl.y,br.y)+pad);
    L.DomUtil.setPosition(svg,min);
    svg.setAttribute('width',max.x-min.x);
    svg.setAttribute('height',max.y-min.y);
    g.setAttribute('transform',`translate(${-min.x},${-min.y})`);

    while(g.firstChild) g.removeChild(g.firstChild);
    const {hosted}=perYear[YEAR];

    // flows (casing first, then colored, then arrowhead)
    currentFlows.forEach(r=>{
      const pO=project(r.o), pD=project(r.d); if(!pO||!pD) return;
      const rO=nodeR(hosted[r.o]||0), rD=nodeR(hosted[r.d]||0);
      const w=flowW(r.v);
      const fp=flowPath(pO,pD,rO,rD);
      const cas=document.createElementNS(NS,'path');
      cas.setAttribute('d',fp.d);cas.setAttribute('class','casing');
      cas.setAttribute('stroke-width',w+3);g.appendChild(cas);
      const p=document.createElementNS(NS,'path');
      p.setAttribute('d',fp.d);p.setAttribute('class','flow');
      p.setAttribute('stroke-width',w);
      p.addEventListener('mousemove',e=>showTip(
        `<b>${fmt(r.v)}</b> IDPs<br>${r.o} → ${r.d}<br><span style="opacity:.7">${YEAR}</span>`,e.clientX,e.clientY));
      p.addEventListener('mouseleave',hideTip);
      g.appendChild(p);
      const ah=document.createElementNS(NS,'polygon');
      ah.setAttribute('points',arrowHead(fp.tip,fp.tux,fp.tuy,w));
      ah.setAttribute('class','arrow');g.appendChild(ah);
    });

    // nodes on top
    const shown=new Set();
    currentFlows.forEach(r=>{shown.add(r.o);shown.add(r.d);});
    // also include any region hosting people even if no arrow passes threshold
    Object.keys(hosted).forEach(k=>{ if(hosted[k]>0) shown.add(k); });
    [...shown].sort((a,b)=>(hosted[b]||0)-(hosted[a]||0)).forEach(name=>{
      const p=project(name); if(!p) return;
      const v=hosted[name]||0; if(v<=0 && !shown.has(name)) return;
      const r=nodeR(v);
      const c=document.createElementNS(NS,'circle');
      c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',r);
      c.setAttribute('class','node');
      c.addEventListener('mousemove',e=>{
        const {origin}=perYear[YEAR];
        showTip(`<b>${name}</b><br>Hosting <b>${fmt(v)}</b> IDPs<br>Origin of ${fmt(origin[name]||0)} IDPs<br><span style="opacity:.7">${YEAR}</span>`,e.clientX,e.clientY);});
      c.addEventListener('mouseleave',hideTip);
      g.appendChild(c);
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',p.x);t.setAttribute('y',p.y-r-4);
      t.setAttribute('text-anchor','middle');t.setAttribute('class','nodelab');
      t.textContent=name;g.appendChild(t);
    });
  }

  function buildLegend(){
    const el=document.getElementById('legend');
    const w1=flowW(10000), w2=flowW(100000), w3=flowW(maxFlow);
    const n1=nodeR(50000), n2=nodeR(maxNode);
    el.innerHTML=`
      <div style="color:var(--text-primary);font-weight:600;margin-bottom:6px">${YEAR} displacement flows</div>
      <div class="lrow"><svg width="60" height="14"><line x1="2" y1="7" x2="58" y2="7" stroke="var(--flow)" stroke-width="${w1}" stroke-linecap="round"/></svg><span>10,000</span></div>
      <div class="lrow"><svg width="60" height="16"><line x1="2" y1="8" x2="58" y2="8" stroke="var(--flow)" stroke-width="${w2}" stroke-linecap="round"/></svg><span>100,000</span></div>
      <div class="lrow"><svg width="60" height="22"><line x1="2" y1="11" x2="58" y2="11" stroke="var(--flow)" stroke-width="${w3}" stroke-linecap="round"/></svg><span>${fmt(maxFlow)} IDPs</span></div>
      <div class="lrow" style="margin-top:8px"><svg width="60" height="${n2*2+4}"><circle cx="20" cy="${n2+2}" r="${n1}" fill="var(--node)" fill-opacity=".55" stroke="var(--node)"/><circle cx="46" cy="${n2+2}" r="${n2}" fill="var(--node)" fill-opacity=".55" stroke="var(--node)"/></svg><span>IDPs hosted<br>(circle area)</span></div>`;
  }

  map.on('moveend zoomend viewreset',positionAndDraw);
  // frame the whole country (all region centroids), leaving room for the panel
  const cll=Object.values(centroids).map(c=>[c.lat,c.lon]);
  map.fitBounds(L.latLngBounds(cll),{paddingTopLeft:[300,20],paddingBottomRight:[30,120]});
  render();
})();
</script>
</body>
</html>
